[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ethanyulabs/alter"

# 依赖版本集中在这里声明，成员 crate 用 `xxx.workspace = true` 引用
[workspace.dependencies]
alter-core = { path = "crates/alter-core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt", "macros", "signal", "sync", "time", "net", "io-util"] }
tokio-tungstenite = "0.28"
tungstenite = "0.28"
getrandom = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
ulid = "3.0.0"
# Cookie 导入：钥匙串取 Safe Storage 口令，PBKDF2 + AES-128-CBC 解密
security-framework = "3.7.0"
pbkdf2 = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc"] }
# 仅测试使用
assert_cmd = "2.2.2"
tempfile = "3.27.0"
wait-timeout = "0.2.1"
