[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ethanyulabs/alter"

# 依赖版本集中在这里声明，成员 crate 用 `xxx.workspace = true` 引用
[workspace.dependencies]
alter-core = { path = "crates/alter-core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt", "macros", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
# 仅测试使用
assert_cmd = "2.2.2"
tempfile = "3.27.0"
wait-timeout = "0.2.1"
